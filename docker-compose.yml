# Solo para desarrollo local — levanta la base con `docker compose up -d db`.
# En el VPS la base se corre como contenedor suelto (Paso 2 de la guía de
# deploy) y la app corre con PM2, no con Docker.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
      POSTGRES_DB: pedidos
    ports:
      - "5442:5432"
    volumes:
      - pedidos_db_data:/var/lib/postgresql/data

volumes:
  pedidos_db_data:
